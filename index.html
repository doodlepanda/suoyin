<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <title>6寸照片缩略图排版</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1d232b;
      --muted: #657080;
      --line: #d9dee7;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --warn: #9a5b12;
      --shadow: 0 18px 40px rgba(29, 35, 43, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
      grid-template-rows: auto auto auto auto auto;
      column-gap: 18px;
      align-items: start;
      min-height: 100vh;
      padding: 16px;
    }

    .sidebar {
      display: contents;
    }

    .brand {
      grid-column: 2;
      grid-row: 3;
      width: min(100%, 980px);
      justify-self: center;
      margin: 0;
      padding: 18px 18px 0;
      background: var(--panel);
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .dropzone {
      grid-column: 2;
      grid-row: 4;
      width: min(100%, 980px);
      justify-self: center;
      display: grid;
      place-items: center;
      min-height: 82px;
      padding: 14px;
      border: 2px dashed #b8c1ce;
      border-radius: 8px;
      background: #fbfcfd;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .dropzone:hover,
    .dropzone.is-over {
      border-color: var(--accent);
      background: #eef9f7;
    }

    .dropzone strong {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .dropzone span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .section {
      width: min(100%, 980px);
      justify-self: center;
      min-width: 0;
      margin-top: 0;
      padding: 18px;
      border-top: 0;
      background: var(--panel);
    }

    .layout-section {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(210px, 1fr));
      gap: 10px 14px;
    }

    .layout-section h2 {
      grid-column: 1 / -1;
    }

    .info-section {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .info-section h2 {
      grid-column: 1 / -1;
    }

    .output-section {
      grid-column: 1;
      grid-row: 1;
      position: sticky;
      top: 24px;
      width: 100%;
      align-self: start;
      box-shadow: var(--shadow);
    }

    .output-section .button-row {
      grid-template-columns: 1fr;
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: 0;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 10px;
    }

    .field label,
    .check span {
      color: var(--muted);
      font-size: 13px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 78px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
    }

    input[type="file"].inline-file {
      width: 100%;
      min-height: 36px;
      padding: 7px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .check input {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    .export-result {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .export-result.is-visible {
      display: block;
    }

    .export-result img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: contain;
      border: 1px solid var(--line);
      background: #fff;
    }

    .export-result .button {
      width: 100%;
      margin-top: 10px;
    }

    .stats {
      display: grid;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stats div {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid #edf0f4;
      padding-bottom: 6px;
    }

    .stats strong {
      color: var(--ink);
      font-weight: 600;
      text-align: right;
    }

    .workspace {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      place-items: center;
      padding: 0 0 18px;
      overflow: auto;
    }

    .paper-shell {
      width: min(100%, 980px);
    }

    .paper-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .paper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .paper.is-over {
      outline: 3px solid var(--accent);
      outline-offset: 6px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .notice {
      margin-top: 12px;
      color: var(--warn);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .sidebar {
        display: contents;
      }

      .workspace,
      .brand,
      .dropzone,
      .layout-section,
      .info-section,
      .output-section {
        grid-column: 1;
        width: 100%;
      }

      .workspace {
        grid-row: 1;
        padding: 0 0 18px;
      }

      .output-section {
        grid-row: 2;
        position: static;
      }

      .info-section {
        grid-row: 3;
        grid-template-columns: 1fr;
      }

      .brand {
        grid-row: 5;
      }

      .dropzone {
        grid-row: 6;
      }

      .layout-section {
        grid-row: 4;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <h1 class="brand">6寸照片缩略图排版</h1>

      <label class="dropzone" id="dropzone">
        <input class="file-input" id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.gif,.bmp,.tif,.tiff,.heic,.heif,.hif" multiple>
        <span>
          <strong>选择或拖入照片</strong>
          可分多次添加照片，最多排入 42 张
        </span>
      </label>

      <section class="section layout-section">
        <h2>排版</h2>
        <div class="field">
          <label for="gapInput">照片间距</label>
          <div class="control-row">
            <input id="gapRange" type="range" min="0" max="40" value="6">
            <input id="gapInput" type="number" min="0" max="80" value="6">
          </div>
        </div>
        <div class="field">
          <label for="marginInput">左右边距</label>
          <div class="control-row">
            <input id="marginRange" type="range" min="0" max="120" value="24">
            <input id="marginInput" type="number" min="0" max="240" value="24">
          </div>
        </div>
        <div class="field">
          <label for="footerInput">底部留白</label>
          <div class="control-row">
            <input id="footerRange" type="range" min="90" max="320" value="190">
            <input id="footerInput" type="number" min="60" max="420" value="190">
          </div>
        </div>
        <div class="field">
          <label for="fitMode">照片显示</label>
          <select id="fitMode">
            <option value="contain">完整显示，不裁剪</option>
          </select>
        </div>
        <label class="check">
          <input id="drawGuides" type="checkbox" checked>
          <span>显示裁切参考线</span>
        </label>
      </section>

      <section class="section info-section">
        <h2>底部信息</h2>
        <div class="field">
          <label for="manualNumber">手工输入编号</label>
          <input id="manualNumber" type="text" placeholder="例如：A-001">
        </div>
      </section>

      <section class="section output-section">
        <h2>输出</h2>
        <dl class="stats">
          <div><dt>相纸尺寸</dt><dd><strong>6 x 4 英寸</strong></dd></div>
          <div><dt>导出像素</dt><dd><strong>1800 x 1200</strong></dd></div>
          <div><dt>单张缩略图</dt><dd><strong id="thumbSize">-</strong></dd></div>
          <div><dt>底部留白</dt><dd><strong id="footerSize">-</strong></dd></div>
          <div><dt>已载入照片</dt><dd><strong id="imageCount">0 / 42</strong></dd></div>
        </dl>
        <div class="button-row">
          <button class="button" id="clearButton" type="button">清空照片</button>
          <button class="button primary" id="downloadPngButton" type="button">导出 PNG</button>
          <button class="button primary" id="downloadJpgButton" type="button">导出 JPG</button>
        </div>
        <div class="export-result" id="exportResult">
          <img id="exportImage" alt="导出的排版图片">
          <a class="button primary" id="saveImageLink" href="#" download>保存图片</a>
        </div>
        <p class="notice" id="notice"></p>
      </section>
    </aside>

    <section class="workspace" aria-label="画布预览">
      <div class="paper-shell">
        <div class="paper-label">
          <span>预览</span>
          <span id="layoutLabel">自动排版，每张 3:2</span>
        </div>
        <div class="paper">
          <canvas id="canvas" width="1800" height="1200"></canvas>
        </div>
      </div>
    </section>
  </main>

    const canvas = document.getElementById('canvas');

    let images = [];
    let logo = null;
    let statusMessage = '';
    let exportUrl = '';
    const SUPPORTED_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'tif', 'tiff', 'heic', 'heif', 'hif'];

    function getExtension(name) {
      const parts = String(name || '').toLowerCase().split('.');
      return parts.length > 1 ? parts.pop() : '';
    }

    function isSupportedPhotoFile(file) {
      return Boolean(file && (file.type.startsWith('image/') || SUPPORTED_EXTENSIONS.includes(getExtension(file.name))));
    }

    function extractFiveDigitNumber(value) {
      const match = String(value || '').match(/\d{5}/);
      return match ? match[0] : '';
    }

    function loadImageFromSrc(src, name = '') {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve({ name, src, image });
        image.onerror = () => resolve(null);
        image.src = src;
      });
    }

    function fileToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    async function imageFileToItem(file) {
      const src = await fileToDataUrl(file);
      if (!src) return null;
      return loadImageFromSrc(src, file.name);
    }

    function getGridSize() {
      const count = images.length;
      if (count <= 0) return { cols: MAX_COLS, rows: MAX_ROWS };
      let best = null;
      const gap = clamp(gapInput.value, 0, 80);
      const sideMargin = clamp(marginInput.value, 0, 240);
      const footerTarget = clamp(footerInput.value, 60, 420);
      const footerAllowance = Math.max(60, footerTarget - 24);

      for (let cols = 1; cols <= MAX_COLS; cols += 1) {
        const rows = Math.ceil(count / cols);
        if (rows > MAX_ROWS) continue;

        const ratio = cols / rows;
        const paperGridRatio = 1.5;
        const balancePenalty = Math.abs(ratio - paperGridRatio);
        const emptySlots = cols * rows - count;
        const availableW = CANVAS_W - sideMargin * 2 - gap * (cols - 1);
        const availableH = CANVAS_H - footerAllowance - 18 - gap * (rows - 1);
        const widthBasedThumbW = availableW / cols;
        const heightBasedThumbW = availableH / rows * THUMB_RATIO;
        const estimatedThumbW = Math.min(widthBasedThumbW, heightBasedThumbW);
        const score = estimatedThumbW - emptySlots * 120 - balancePenalty * 35;

        if (!best || score > best.score) best = { cols, rows, score };
      }

      return best || { cols: MAX_COLS, rows: MAX_ROWS };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, Number(value) || 0));
    }

    function syncPair(range, number, min, max, onChange) {
      const update = (source) => {
        const value = clamp(source.value, min, max);
        range.value = value;
        number.value = value;
        onChange();
      };
      range.addEventListener('input', () => update(range));
      number.addEventListener('input', () => update(number));
    }

    function getLayout() {
      const grid = getGridSize();
      const cols = grid.cols;
      const rows = grid.rows;
      const gap = clamp(gapInput.value, 0, 80);
      const sideMargin = clamp(marginInput.value, 0, 240);
      const footerTarget = clamp(footerInput.value, 60, 420);
      const footerAllowance = Math.max(60, footerTarget - 24);
      const availableW = CANVAS_W - sideMargin * 2 - gap * (cols - 1);
      const availableH = CANVAS_H - footerAllowance - 18 - gap * (rows - 1);
      const widthBasedThumbW = availableW / cols;
      const heightBasedThumbW = availableH / rows * THUMB_RATIO;
      const thumbW = Math.max(1, Math.floor(Math.min(widthBasedThumbW, heightBasedThumbW)));
      const thumbH = Math.floor(thumbW / THUMB_RATIO);
      const gridW = thumbW * cols + gap * (cols - 1);
      const gridH = thumbH * rows + gap * (rows - 1);
      const offsetX = Math.round((CANVAS_W - gridW) / 2);
      const offsetY = Math.max(18, Math.round((CANVAS_H - footerTarget - gridH) / 2));
      const footerTop = offsetY + gridH;
      const actualFooter = CANVAS_H - footerTop;
      return { cols, rows, gap, thumbW, thumbH, gridW, gridH, offsetX, offsetY, footerTop, actualFooter };
    }

    function drawImageInBox(image, x, y, w, h) {
      const sourceRatio = image.naturalWidth / image.naturalHeight;
      const targetRatio = w / h;
      let dx = x;
      let dy = y;
      let dw = w;
      let dh = h;

      if (sourceRatio > targetRatio) {
        dh = w / sourceRatio;
        dy = y + (h - dh) / 2;
      } else {
        dw = h * sourceRatio;
        dx = x + (w - dw) / 2;
      }

      ctx.drawImage(image, dx, dy, dw, dh);
    }

    function drawPlaceholder(x, y, w, h, index) {
      ctx.fillStyle = '#f0f3f7';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#c9d1dc';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = '#7a8491';
      ctx.font = '28px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(index + 1), x + w / 2, y + h / 2);
    }

    function drawFooter(layout) {
      const footerTop = Math.max(layout.footerTop, CANVAS_H - layout.actualFooter);
      const leftX = layout.offsetX;
      const rightX = layout.offsetX + layout.gridW;
      const number = manualNumber.value.trim();

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, footerTop, CANVAS_W, CANVAS_H - footerTop);

      ctx.strokeStyle = 'rgba(101, 112, 128, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(leftX, footerTop + 26);
      ctx.lineTo(rightX, footerTop + 26);
      ctx.stroke();

      if (number) {
        ctx.fillStyle = '#1d232b';
        ctx.font = '42px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(`No.${number}`, leftX, CANVAS_H - 48);
      }

      if (logo) {
        const maxW = 300;
        const maxH = Math.max(72, Math.min(120, layout.actualFooter - 34));
        const ratio = logo.image.naturalWidth / logo.image.naturalHeight;
        let w = maxW;
        let h = w / ratio;
        if (h > maxH) {
          h = maxH;
          w = h * ratio;
        }
        ctx.drawImage(logo.image, rightX - w, CANVAS_H - 12 - h, w, h);
      }

      ctx.restore();
    }

    function draw() {
      const layout = getLayout();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      for (let i = 0; i < images.length; i += 1) {
        const col = i % layout.cols;
        const row = Math.floor(i / layout.cols);
        const x = layout.offsetX + col * (layout.thumbW + layout.gap);
        const y = layout.offsetY + row * (layout.thumbH + layout.gap);

        if (images[i]) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, layout.thumbW, layout.thumbH);
          ctx.clip();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x, y, layout.thumbW, layout.thumbH);
          drawImageInBox(images[i].image, x, y, layout.thumbW, layout.thumbH);
          ctx.restore();

          if (drawGuides.checked) {
            ctx.strokeStyle = 'rgba(15, 118, 110, 0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 1, y + 1, layout.thumbW - 2, layout.thumbH - 2);
          }
        }
      }

      drawFooter(layout);

      thumbSize.textContent = `${layout.thumbW} x ${layout.thumbH} px`;
      footerSize.textContent = `${Math.max(0, Math.round(layout.actualFooter))} px`;
      imageCount.textContent = `${images.length} / ${MAX_IMAGES}`;
      layoutLabel.textContent = `${layout.cols} 列 x ${layout.rows} 行，每张 3:2`;
      notice.textContent = statusMessage || (layout.gridH + layout.actualFooter > CANVAS_H
        ? '当前边距或间距过大，缩略图可能超出相纸范围。'
        : '');
    }

    async function readFiles(fileList, options = {}) {
      const remaining = MAX_IMAGES - images.length;
      if (remaining <= 0) {
        statusMessage = '已经排满 42 张照片，请先清空后再添加。';
        draw();
        return;
      }

      if (options.folderNumber) {
        manualNumber.value = options.folderNumber;
      }

      const sourceFiles = Array.from(fileList)
        .filter(isSupportedPhotoFile)
        .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true }));
      const files = sourceFiles.slice(0, remaining);

      const loaded = await Promise.all(files.map(file => imageFileToItem(file)));

      images = images.concat(loaded.filter(Boolean));
      statusMessage = sourceFiles.length > files.length
        ? `本次只添加了 ${files.length} 张，已达到 42 张上限。`
        : '';
      fileInput.value = '';
      draw();
    }

    function readAllDirectoryEntries(reader) {
      return new Promise((resolve, reject) => {
        const entries = [];
        const readBatch = () => {
          reader.readEntries(batch => {
            if (!batch.length) {
              resolve(entries);
              return;
            }
            entries.push(...batch);
            readBatch();
          }, reject);
        };
        readBatch();
      });
    }

    function entryToFile(entry) {
      return new Promise(resolve => {
        entry.file(file => resolve(file), () => resolve(null));
      });
    }

    async function collectFilesFromEntry(entry) {
      if (!entry) return [];
      if (entry.isFile) {
        const file = await entryToFile(entry);
        return file ? [file] : [];
      }
      if (entry.isDirectory) {
        const reader = entry.createReader();
        const entries = await readAllDirectoryEntries(reader);
        const nested = await Promise.all(entries.map(collectFilesFromEntry));
        return nested.flat();
      }
      return [];
    }

    async function readDrop(event) {
      const items = Array.from(event.dataTransfer.items || []);
      if (!items.length) {
        await readFiles(event.dataTransfer.files);
        return;
      }

      let folderNumber = '';
      const entryPromises = [];
      for (const item of items) {
        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
        if (entry) {
          if (entry.isDirectory && !folderNumber) {
            folderNumber = extractFiveDigitNumber(entry.name);
          }
          entryPromises.push(collectFilesFromEntry(entry));
        } else if (item.kind === 'file') {
          const file = item.getAsFile();
          if (file) entryPromises.push(Promise.resolve([file]));
        }
      }

      const files = (await Promise.all(entryPromises)).flat();
      await readFiles(files, { folderNumber });
    }

    function loadDefaultLogo() {
      loadImageFromSrc(DEFAULT_LOGO_SRC, 'fiona-logo.png').then(item => {
        if (!item) return;
        logo = { ...item, isDefault: true };
        draw();
      });
    }

    function showExport(dataUrl, filename, label) {
      if (exportUrl) {
        URL.revokeObjectURL(exportUrl);
        exportUrl = '';
      }

      exportImage.src = dataUrl;
      saveImageLink.href = dataUrl;
      saveImageLink.download = filename;
      saveImageLink.textContent = `保存 ${label} 图片`;
      exportResult.classList.add('is-visible');

      if (saveWithNativeClient(dataUrl, filename, label)) {
        exportResult.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }

      const link = document.createElement('a');
      link.download = filename;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      link.remove();

      statusMessage = `导出图已生成；如果 Safari 没有自动下载，请点下方“保存 ${label} 图片”，或右键图片保存。`;
      draw();
      exportResult.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function showExportBlob(blob, filename, label) {
      if (exportUrl) URL.revokeObjectURL(exportUrl);
      exportUrl = URL.createObjectURL(blob);
      exportImage.src = exportUrl;
      saveImageLink.href = exportUrl;
      saveImageLink.download = filename;
      saveImageLink.textContent = `保存 ${label} 图片`;
      exportResult.classList.add('is-visible');

      if (hasNativeSave()) {
        const reader = new FileReader();
        reader.onload = () => {
          saveWithNativeClient(reader.result, filename, label);
          exportResult.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        };
        reader.onerror = () => {
          statusMessage = `导出失败：无法读取 ${label} 图片数据`;
          draw();
        };
        reader.readAsDataURL(blob);
        return;
      }

      const link = document.createElement('a');
      link.download = filename;
      link.href = exportUrl;
      document.body.appendChild(link);
      link.click();
      link.remove();

      statusMessage = `导出图已生成；如果 Safari 没有自动下载，请点下方“保存 ${label} 图片”，或右键图片保存。`;
      draw();
      exportResult.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function hasNativeSave() {
      return Boolean(
        window.webkit
        && window.webkit.messageHandlers
        && window.webkit.messageHandlers.saveImage
      );
    }

    function saveWithNativeClient(dataUrl, filename, label) {
      if (!hasNativeSave()) return false;
      window.webkit.messageHandlers.saveImage.postMessage({ dataUrl, filename });
      statusMessage = `已生成 ${label} 图片，请在弹出的窗口中选择保存位置。`;
      draw();
      return true;
    }

    function getDateStamp() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}${month}${day}`;
    }

    function sanitizeFilenamePart(value) {
      return value
        .trim()
        .replace(/[\\/:*?"<>|]+/g, '-')
        .replace(/\s+/g, '')
        .replace(/^-+|-+$/g, '');
    }

    function getExportFilename(extension) {
      const number = sanitizeFilenamePart(manualNumber.value);
      const base = number ? `No.${number}` : '照片排版';
      return `${base}_${getDateStamp()}.${extension}`;
    }

    function exportCanvas(format, retryWithoutLogo = false) {
      const isJpg = format === 'jpg';
      const mime = isJpg ? 'image/jpeg' : 'image/png';
      const filename = getExportFilename(isJpg ? 'jpg' : 'png');
      const label = isJpg ? 'JPG' : 'PNG';

      try {
        if (canvas.toBlob) {
          canvas.toBlob((blob) => {
            if (blob) {
              showExportBlob(blob, filename, label);
              return;
            }

            try {
              showExport(canvas.toDataURL(mime, isJpg ? 0.95 : undefined), filename, label);
            } catch (error) {
              if (!retryWithoutLogo && error.name === 'SecurityError' && logo) {
                const savedLogo = logo;
                logo = null;
                draw();
                exportCanvas(format, true);
                logo = savedLogo;
                draw();
                return;
              }
              statusMessage = `导出失败：${error.message}`;
              draw();
            }
          }, mime, isJpg ? 0.95 : undefined);
          return;
        }

        showExport(canvas.toDataURL(mime, isJpg ? 0.95 : undefined), filename, label);
      } catch (error) {
        if (!retryWithoutLogo && error.name === 'SecurityError' && logo) {
          const savedLogo = logo;
          logo = null;
          draw();
          exportCanvas(format, true);
          logo = savedLogo;
          draw();
          return;
        }
        statusMessage = `导出失败：${error.message}`;
        draw();
      }
    }

    function download(format) {
      exportCanvas(format);
    }

    syncPair(gapRange, gapInput, 0, 80, draw);
    syncPair(marginRange, marginInput, 0, 240, draw);
    syncPair(footerRange, footerInput, 60, 420, draw);
    fitMode.addEventListener('change', draw);
    drawGuides.addEventListener('change', draw);
    manualNumber.addEventListener('input', draw);
    fileInput.addEventListener('change', event => readFiles(event.target.files));
    downloadPngButton.addEventListener('click', () => download('png'));
    downloadJpgButton.addEventListener('click', () => download('jpg'));
    clearButton.addEventListener('click', () => {
      images = [];
      statusMessage = '';
      fileInput.value = '';
      draw();
    });

    function bindDropTarget(target) {
      ['dragenter', 'dragover'].forEach(type => {
        target.addEventListener(type, event => {
          event.preventDefault();
          target.classList.add('is-over');
        });
      });

      ['dragleave', 'drop'].forEach(type => {
        target.addEventListener(type, event => {
          event.preventDefault();
          target.classList.remove('is-over');
        });
      });

      target.addEventListener('drop', event => readDrop(event));
    }

    bindDropTarget(dropzone);
    bindDropTarget(paper);

    document.addEventListener('dragover', event => {
      if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) {
        event.preventDefault();
      }
    });

    loadDefaultLogo();
    draw();
  </script>
</body>
</html>
